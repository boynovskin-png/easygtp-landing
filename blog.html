<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyGTP – Блог</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0a0a;--orange:#f97316;--orange-dark:#c45c0e;--white:#f5f5f0;--gray:#161616;--gray2:#1f1f1f;--muted:#666;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#fff;color:#111;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}

  /* NAV */
  nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #1a1a1a;background:#0a0a0a;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo-box{width:36px;height:36px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .logo-box svg{width:20px;height:20px;fill:white;}
  .logo-text{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;letter-spacing:-0.3px;color:#fff;}
  .logo-text span{color:var(--orange);}
  .nav-right{display:flex;gap:8px;}
  .btn-login{padding:8px 16px;border:1px solid #2a2a2a;border-radius:50px;background:transparent;color:#aaa;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;}
  .btn-login:hover{border-color:#f97316;color:#f97316;}
  .btn-start{padding:8px 18px;background:var(--orange);border:none;border-radius:50px;color:white;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.2s;}
  .btn-start:hover{opacity:0.9;}
  .btn-blog{padding:8px 18px;border:1px solid #333;border-radius:50px;background:transparent;color:#ccc;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;letter-spacing:0.2px;}
  .btn-blog:hover{border-color:#f97316;color:#f97316;}
  .btn-blog.active{border-color:#f97316;color:#f97316;}

  /* VIEWS */
  #view-list{display:block;}
  #view-article{display:none;}
  .page{max-width:480px;margin:0 auto;padding-bottom:80px;background:#fff;}

  /* BLOG HEADER */
  .blog-header{padding:24px 20px 18px;border-bottom:1px solid #e8e8e8;background:#fff;}
  .blog-label{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--orange);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .label-line{width:20px;height:1px;background:var(--orange);}
  .blog-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:900;line-height:1.1;margin-bottom:6px;letter-spacing:-0.5px;color:#111;}
  .blog-sub{font-size:13px;color:#888;line-height:1.5;}

  /* SEARCH */
  .search-wrap{padding:14px 20px;border-bottom:1px solid #e8e8e8;position:relative;background:#fff;}
  .search-input{width:100%;background:#f7f7f7;border:1px solid #e0e0e0;border-radius:10px;color:#111;font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 14px;outline:none;transition:border-color 0.2s;letter-spacing:0.1px;}
  .search-input:focus{border-color:var(--orange);}
  .search-input::placeholder{color:#bbb;}

  /* CATEGORIES */
  .cats{display:flex;gap:6px;overflow-x:auto;padding:12px 20px;border-bottom:1px solid #e8e8e8;scrollbar-width:none;background:#fff;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-pill{flex-shrink:0;padding:6px 16px;border-radius:4px;border:1px solid #e0e0e0;background:transparent;color:#666;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
  .cat-pill.active{background:var(--orange);border-color:var(--orange);color:white;}
  .cat-pill:hover:not(.active){border-color:#bbb;color:#333;}

  /* FEATURED */
  .featured-wrap{padding:16px 20px 0;}
  .featured-card{background:#fff;border:1px solid #e8e8e8;border-top:3px solid var(--orange);border-radius:4px;padding:22px;cursor:pointer;transition:border-color 0.2s;animation:fadeUp 0.3s ease both;}
  .featured-card:hover{border-color:var(--orange);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .feat-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--orange);margin-bottom:12px;}
  .feat-cat{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#999;margin-bottom:8px;}
  .feat-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;line-height:1.2;margin-bottom:10px;letter-spacing:-0.3px;color:#111;}
  .feat-excerpt{font-size:13px;color:#555;line-height:1.6;margin-bottom:18px;}
  .feat-bottom{display:flex;align-items:center;justify-content:space-between;}
  .feat-meta{font-size:11px;color:#aaa;letter-spacing:0.3px;}
  .feat-btn{background:var(--orange);border:none;border-radius:4px;color:white;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:9px 18px;cursor:pointer;transition:opacity 0.2s;}
  .feat-btn:hover{opacity:0.9;}

  /* SECTION HEADER */
  .sec-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;background:#fff;}
  .sec-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#999;}
  .sec-count{font-size:11px;color:#bbb;}

  /* ARTICLE CARDS */
  .articles-wrap{padding:0 20px;background:#fff;}
  .article-card{display:flex;gap:0;align-items:stretch;background:#fff;border:1px solid #e8e8e8;border-radius:4px;margin-bottom:8px;cursor:pointer;transition:border-color 0.2s;overflow:hidden;animation:fadeUp 0.3s ease both;}
  .article-card:hover{border-color:var(--orange);}
  .card-accent{width:3px;flex-shrink:0;background:#e8e8e8;transition:background 0.2s;}
  .article-card:hover .card-accent{background:var(--orange);}
  .card-inner{padding:14px 16px;flex:1;min-width:0;}
  .card-cat{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange);margin-bottom:5px;}
  .card-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;line-height:1.3;margin-bottom:5px;color:#111;}
  .card-excerpt{font-size:12px;color:#666;line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-bottom{display:flex;align-items:center;gap:10px;}
  .card-date{font-size:11px;color:#aaa;letter-spacing:0.3px;}

  .badge{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:2px;}
  .b-hot{background:rgba(249,115,22,0.1);color:var(--orange);border:1px solid rgba(249,115,22,0.3);}
  .b-new{background:#f5f5f5;color:#666;border:1px solid #ddd;}
  .b-law{background:#f5f5f5;color:#666;border:1px solid #ddd;}

  .no-res{text-align:center;padding:48px 20px;display:none;background:#fff;}
  .no-res.show{display:block;}
  .no-res p{font-size:14px;color:#aaa;}

  /* ARTICLE PAGE */
  .art-page{max-width:480px;margin:0 auto;padding-bottom:80px;}

  .back-btn{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid #e5e5e5;cursor:pointer;color:#888;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;background:#fff;border-top:none;border-left:none;border-right:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:color 0.2s;}
  .back-btn:hover{color:var(--orange);}
  .back-btn span{font-size:16px;line-height:1;}

  .art-hero{padding:24px 20px 22px;border-bottom:1px solid #e8e8e8;background:#fff;}
  .art-cat{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--orange);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .art-cat::after{content:'';flex:1;height:1px;background:#e8e8e8;}
  .art-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:900;line-height:1.15;margin-bottom:14px;letter-spacing:-0.5px;color:#111;}
  .art-meta{display:flex;gap:20px;font-size:11px;color:#999;margin-bottom:18px;letter-spacing:0.3px;text-transform:uppercase;}
  .art-lead{font-size:15px;color:#444;line-height:1.7;padding:16px 18px;background:#fff8f4;border-left:3px solid var(--orange);}

  /* ARTICLE BODY */
  .art-body{padding:24px 20px 0;background:#fff;}
  .art-body h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin:28px 0 12px;color:#111;letter-spacing:-0.2px;padding-bottom:8px;border-bottom:1px solid #ebebeb;}
  .art-body h2:first-child{margin-top:0;}
  .art-body p{font-size:14px;color:#333;line-height:1.8;margin-bottom:14px;}
  .art-body strong{color:#111;font-weight:700;}
  .art-body ul{list-style:none;margin-bottom:16px;background:#fafafa;border:1px solid #ebebeb;border-radius:4px;overflow:hidden;}
  .art-body ul li{display:flex;gap:12px;font-size:13px;color:#333;padding:11px 14px;border-bottom:1px solid #ebebeb;line-height:1.5;}
  .art-body ul li:last-child{border:none;}
  .art-body ul li::before{content:"—";color:var(--orange);flex-shrink:0;font-weight:700;}

  .warn-box{background:#fff5f5;border:1px solid #fdd;border-left:3px solid #c0392b;border-radius:0 4px 4px 0;padding:14px 16px;margin:16px 0;}
  .warn-box p{font-size:13px;color:#7a2020;margin:0;line-height:1.6;}
  .warn-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#c0392b;margin-bottom:6px;}

  .tip-box{background:#f5fbf5;border:1px solid #d4edda;border-left:3px solid #27ae60;border-radius:0 4px 4px 0;padding:14px 16px;margin:16px 0;}
  .tip-box p{font-size:13px;color:#1a5c2e;margin:0;line-height:1.6;}
  .tip-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#27ae60;margin-bottom:6px;}

  /* CTA */
  .art-cta{margin:24px 20px;background:var(--orange);border-radius:4px;padding:24px;text-align:center;}
  .art-cta h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:900;margin-bottom:6px;color:white;letter-spacing:-0.3px;}
  .art-cta p{font-size:13px;color:rgba(255,255,255,0.8);margin-bottom:18px;line-height:1.5;}
  .cta-big{display:block;width:100%;background:white;border:none;border-radius:4px;color:var(--orange);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:13px;cursor:pointer;transition:opacity 0.2s;}
  .cta-big:hover{opacity:0.92;}

  /* RELATED */
  .related{padding:0 20px;background:#fff;padding-bottom:8px;}
  .related-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#999;margin-bottom:14px;display:flex;align-items:center;gap:10px;padding-top:4px;}
  .related-label::after{content:'';flex:1;height:1px;background:#e8e8e8;}
  .rel-card{display:flex;gap:0;align-items:stretch;background:#fff;border:1px solid #e8e8e8;border-radius:4px;margin-bottom:8px;cursor:pointer;transition:border-color 0.2s;overflow:hidden;}
  .rel-card:hover{border-color:var(--orange);}
  .rel-accent{width:3px;flex-shrink:0;background:var(--orange);}
  .rel-inner{padding:12px 14px;flex:1;}
  .rel-inner h4{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:3px;color:#111;}
  .rel-inner p{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;}
</style>
</head>
<body>

<nav>
  <div class="logo" onclick="showList()">

</nav>

<!-- LIST VIEW -->
<div id="view-list">
  <div class="page">
    <div class="blog-header">
      <div class="blog-label"><span class="label-line"></span>2025 — 2026</div>
      <div class="blog-title">Блог и Статии</div>
      <div class="blog-sub">Всичко за ГТП, закони, документи и автомобили в България</div>
    </div>

    <div class="search-wrap">
      <input class="search-input" id="searchInput" placeholder="Търси статия по заглавие или тема..." oninput="applyFilters()">

    <div class="cats">
      <button class="cat-pill active" onclick="filterCat('всички',this)">Всички</button>

      <button class="cat-pill" onclick="filterCat('Безопасност',this)">Безопасност</button>
      <button class="cat-pill" onclick="filterCat('Мотори',this)">Мотори</button>
      <button class="cat-pill" onclick="filterCat('Съвети',this)">Съвети</button>
    </div>

    <div class="featured-wrap" id="featuredWrap"></div>
    <div class="sec-header">
      <div class="sec-title">Всички статии</div>
      <div class="sec-count" id="secCount"></div>
    </div>
    <div class="articles-wrap" id="articlesList"></div>
    <div class="no-res" id="noRes"><p>Няма намерени статии за търсения термин.</p></div>
  </div>
</div>

<!-- ARTICLE VIEW -->
<div id="view-article">
  <div class="art-page">
    <button class="back-btn" onclick="showList()"><span>&#8592;</span> Обратно към блога</button>
    <div id="articleContent"></div>
  </div>
</div>

const ARTICLES = [
  {
    id:0, category:'Съвети', badges:['hot'],

const GTP_URL = 'https://rta.government.bg/services/check-inspection/index.html';
let activeFilter = 'всички';
let searchTerm = '';

function filterCat(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  searchTerm = document.getElementById('searchInput').value.toLowerCase();
  renderList();
}

function getFiltered() {
  return ARTICLES.filter(t => {
    const matchCat = activeFilter === 'всички' || t.category === activeFilter;
    const matchSearch = !searchTerm ||
      t.title.toLowerCase().includes(searchTerm) ||
      t.excerpt.toLowerCase().includes(searchTerm) ||
      t.category.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });
}

function badgeTag(b) {
  const map = { hot:['b-hot','Популярна'], new:['b-new','Ново'], law:['b-law','Закон'] };
  return map[b] ? `<span class="badge ${map[b][0]}">${map[b][1]}</span>` : '';
}

function renderList() {
  const filtered = getFiltered();
  const featured = filtered[0];
  const rest = filtered.slice(1);
  const fw = document.getElementById('featuredWrap');

  if (featured) {
    const bHTML = (featured.badges||[]).map(b => badgeTag(b)).join('');
    fw.innerHTML = `
      <div class="featured-card" onclick="openArticle(${featured.id})">
        <div class="feat-label">Препоръчана статия</div>
        <div class="feat-cat">${featured.category}</div>
        <div class="feat-title">${featured.title}</div>
        <div class="feat-excerpt">${featured.excerpt}</div>
        <div class="feat-bottom">
          <span class="feat-meta">${featured.date} &nbsp;·&nbsp; ${featured.readTime} четене</span>
          <button class="feat-btn">Прочети</button>
        </div>
      </div>`;
  } else fw.innerHTML = '';

  document.getElementById('secCount').textContent = `${filtered.length} статии`;
  const noRes = document.getElementById('noRes');
  if (rest.length === 0 && !featured) {
    document.getElementById('articlesList').innerHTML = '';
    noRes.classList.add('show'); return;
  }
  noRes.classList.remove('show');

  document.getElementById('articlesList').innerHTML = rest.map((t, i) => {
    const bHTML = (t.badges||[]).map(b => badgeTag(b)).join('');
    return `
    <div class="article-card" style="animation-delay:${i * 0.03}s" onclick="openArticle(${t.id})">
      <div class="card-accent"></div>
      <div class="card-inner">
        <div class="card-cat">${t.category}</div>
        <div class="card-title">${t.title}</div>
        <div class="card-excerpt">${t.excerpt}</div>
        <div class="card-bottom">
          <span class="card-date">${t.date}</span>
          ${bHTML}
        </div>
      </div>
    </div>`;
  }).join('');
}

function openArticle(id) {
  const t = ARTICLES.find(x => x.id === id);
  if (!t) return;

  const sectHTML = (t.sections||[]).map(s => {
    let h = s.h ? `<h2>${s.h}</h2>` : '';
    let p = s.p ? `<p>${s.p}</p>` : '';
    let list = s.list ? `<ul>${s.list.map(li => `<li>${li}</li>`).join('')}</ul>` : '';
    return h + p + list;
  }).join('');

  const warnHTML = t.warn ? `
    <div class="warn-box">
      <div class="warn-label">Внимание</div>
      <p>${t.warn}</p>
    </div>` : '';

  const tipHTML = t.tip ? `
    <div class="tip-box">
      <div class="tip-label">Съвет</div>
      <p>${t.tip}</p>
    </div>` : '';

  const relHTML = (t.related||[]).map(rid => {
    const r = ARTICLES.find(x => x.id === rid);
    if (!r) return '';
    return `
      <div class="rel-card" onclick="openArticle(${r.id})">
        <div class="rel-accent"></div>
        <div class="rel-inner">
          <h4>${r.title}</h4>
          <p>${r.category} &nbsp;·&nbsp; ${r.date}</p>
        </div>
      </div>`;
  }).join('');

  document.getElementById('articleContent').innerHTML = `
    <div class="art-hero">
      <div class="art-cat">${t.category}</div>
      <h1 class="art-title">${t.title}</h1>
      <div class="art-meta">
        <span>${t.date}</span>
        <span>${t.readTime} четене</span>
      </div>
      <div class="art-lead">${t.lead}</div>
    </div>
    <div class="art-body">
      ${sectHTML}
      ${warnHTML}
      ${tipHTML}
    </div>
    <div class="art-cta">
      <h3>Провери ГТП на колата си</h3>
      <p>Официална безплатна проверка по регистрационен номер чрез системата на ИА Автомобилна администрация.</p>
      <button class="cta-big" onclick="window.open('${GTP_URL}','_blank')">Провери ГТП официално</button>
    </div>
    <div class="related">
      <div class="related-label">Свързани статии</div>
      ${relHTML}
    </div>`;

  document.getElementById('view-list').style.display = 'none';
  document.getElementById('view-article').style.display = 'block';
  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById('view-list').style.display = 'block';
  document.getElementById('view-article').style.display = 'none';
  window.scrollTo(0, 0);
}

renderList();
</script>
